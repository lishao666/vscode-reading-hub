name: Publish Extension

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx vsce package --out extension.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: extension.vsix
          if-no-files-found: error

  publish-vscode-marketplace:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce@3.6.0 publish --packagePath extension.vsix --pat "$VSCE_PAT"

  publish-open-vsx:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx@1.1.0 publish extension.vsix --pat "$OVSX_PAT"
